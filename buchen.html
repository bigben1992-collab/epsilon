<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lager Beta - Buchen</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 15px; background: #f4f6f8; }
    nav { background: #fff; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    nav a { text-decoration: none; color: #2563eb; font-weight: bold; }
    nav a.active { color: #1e40af; border-bottom: 2px solid #2563eb; }
    
    .card { background: #fff; padding: 15px; border-radius: 6px; max-width: 500px; margin: 0 auto; }
    #reader { width: 100%; max-width: 350px; margin: 0 auto 15px auto; }
    input, select, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-pdf { background: #059669; margin-top: 10px; }
    .btn-cancel { background: #dc2626; }
    #status { margin-top: 10px; font-weight: bold; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .card-header h2 { margin: 0; font-size: 1.3rem; }
    .btn-shopping-toggle {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      width: auto;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-shopping-toggle:hover { background: #e2e8f0; }
    .badge-count {
      background: #2563eb;
      color: white;
      border-radius: 10px;
      padding: 2px 7px;
      font-size: 11px;
    }

    #shoppingListDrawer {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      display: none;
    }
    .drawer-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .shopping-items-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }
    .shopping-item-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .shopping-item-card:hover:not(.completed) {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .shopping-item-info { display: flex; flex-direction: column; }
    .shopping-item-name { font-weight: bold; font-size: 13px; color: #1e293b; }
    .shopping-item-code { font-size: 11px; color: #64748b; }
    .shopping-item-qty {
      background: #dbeafe;
      color: #1e40af;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* NEU: Styling für bereits gebuchte Artikel */
    .shopping-item-card.completed {
      background: #f1f5f9;
      border-color: #e2e8f0;
      opacity: 0.6;
      cursor: not-allowed;
    }
    .shopping-item-card.completed .shopping-item-name {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .shopping-item-card.completed .shopping-item-qty {
      background: #cbd5e1;
      color: #475569;
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
    }
    .field-row input {
      flex: 1;
      margin: 0;
    }
    .scan-radio-label {
      font-size: 13px;
      font-weight: bold;
      color: #1e40af;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      background: #eff6ff;
      padding: 8px 10px;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
    }

    #stockLocationBox {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
    }
    .stock-box-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 8px;
    }
    .place-tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .place-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      color: #0369a1;
      border: 1px solid #bae6fd;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .place-tag:hover { 
      background: #0284c7; 
      color: #ffffff;
      border-color: #0284c7;
      transform: translateY(-1px);
    }
    .place-tag .badge-qty {
      background: #e0f2fe;
      color: #0369a1;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
    }
    .place-tag:hover .badge-qty {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    #productInfoBox {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 12px;
      border-radius: 6px;
      margin: 10px 0;
      display: none;
    }
    .btn-uvp {
      background: #16a34a;
      color: white;
      font-size: 12px;
      padding: 5px 10px;
      margin-top: 8px;
      width: auto;
      display: inline-block;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .modal-box h3 { margin-top: 0; }
    .confirm-code { 
      font-size: 18px; 
      font-weight: bold; 
      color: #2563eb; 
      margin: 10px 0;
      word-break: break-all;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn-group button { flex: 1; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">🏠 Menü</a> |
    <a href="artikel.html">Artikelabfrage & Etikettendruck</a> |
    <a href="platz.html">Platzabfrage</a> |
    <a href="bestandsabfrage.html">Bestandsabfrage</a> |
    <a href="bilanz.html">Bilanz</a> |
    <a href="verwaltung.html">Verwaltung</a>
  </nav>

  <div class="card">
    <div class="card-header">
      <h2>Ware Buchen (EK / VK)</h2>
      <button type="button" class="btn-shopping-toggle" onclick="toggleShoppingList()">
        🛒 Liste <span id="shoppingCountBadge" class="badge-count">0</span>
      </button>
    </div>

    <div id="shoppingListDrawer">
      <div class="drawer-title">
        <span>Offene Positionen zur Buchung</span>
        <span style="cursor:pointer;" onclick="toggleShoppingList()">❌ Schließen</span>
      </div>
      <div id="shoppingListContainer" class="shopping-items-list"></div>
    </div>

    <div id="reader"></div>

    <form id="bookingForm" onsubmit="confirmAndSubmit(event)">
      <div class="field-row">
        <input type="text" id="barcode" placeholder="Barcode" required autofocus>
        <label class="scan-radio-label">
          <input type="radio" name="scanTarget" value="barcode" checked> 📦 Scan
        </label>
      </div>

      <div id="stockLocationBox">
        <div class="stock-box-title">📍 Vorhandene Lagerplätze (Klick zum Auswählen):</div>
        <div id="stockList" class="place-tags-container"></div>
      </div>

      <input type="text" id="name" placeholder="Warenname (optional)">

      <div class="field-row">
        <input type="text" id="platz" list="platzList" placeholder="Lagerplatz (z.B. A1)" required>
        <datalist id="platzList"></datalist>
        <label class="scan-radio-label">
          <input type="radio" name="scanTarget" value="platz"> 📍 Scan
        </label>
      </div>
      
      <select id="typ">
        <option value="EK">Wareneinkauf (EK)</option>
        <option value="VK">Warenverkauf (VK)</option>
      </select>

      <input type="number" id="menge" placeholder="Menge" value="1" min="1" required>
      <input type="number" step="0.01" id="preis" placeholder="Einzelpreis (€)" required>

      <div id="productInfoBox">
        <h4 style="margin: 0 0 5px 0; color: #166534;">ℹ️ Zusätzliche Produkt-Infos</h4>
        <div id="infoContent" style="font-size: 13px; color: #15803d;"></div>
        <button type="button" id="btnApplyUvp" class="btn-uvp" style="display:none;" onclick="applyUvpPrice()">
          🏷️ UVP als VK übernehmen
        </button>
      </div>

      <button type="submit" id="submitBtn">Buchung Ausführen</button>
    </form>

    <div id="status"></div>
    <div id="invoiceArea" style="display: none;">
      <button class="btn-pdf" onclick="generateInvoicePDF()">📄 Rechnung / Quittung als PDF herunterladen</button>
    </div>
  </div>

  <div id="confirmModal" class="modal-overlay">
    <div class="modal-box">
      <h3>Eingabe bestätigen</h3>
      <p id="modalTargetText"></p>
      <div id="modalCode" class="confirm-code"></div>
      <div class="btn-group">
        <button onclick="acceptScanCode()">✅ Übernehmen</button>
        <button class="btn-cancel" onclick="rejectScanCode()">❌ Abbrechen</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwp9yMSa_6WerEL7CIUmDyKdH9G73DZVgbOFmjMQZrxf8IWSEPAbY-mrOlAZT6BoG7P/exec";
    let isProcessing = false;
    let lastBookingData = null;
    let detectedUvp = null;
    let pendingScanText = "";
    let isPaused = false;

    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 });
    
    scanner.render((text) => {
      if (isPaused) return;

      try { scanner.pause(true); } catch(e){}
      isPaused = true;

      pendingScanText = text;
      let scanTarget = document.querySelector('input[name="scanTarget"]:checked').value;
      let targetLabel = scanTarget === 'barcode' ? 'Artikel-Barcode' : 'Lagerplatz';

      document.getElementById('modalTargetText').innerText = `Gescannter Code für ${targetLabel}:`;
      document.getElementById('modalCode').innerText = text;
      document.getElementById('confirmModal').style.display = "flex";
    });

    function acceptScanCode() {
      document.getElementById('confirmModal').style.display = "none";
      let scanTarget = document.querySelector('input[name="scanTarget"]:checked').value;

      if (scanTarget === 'barcode') {
        document.getElementById('barcode').value = pendingScanText;
        fetchArticleInfo(pendingScanText);
        document.querySelector('input[name="scanTarget"][value="platz"]').checked = true;
      } else {
        document.getElementById('platz').value = pendingScanText;
        document.querySelector('input[name="scanTarget"][value="barcode"]').checked = true;
      }

      resumeScanner();
    }

    function rejectScanCode() {
      document.getElementById('confirmModal').style.display = "none";
      pendingScanText = "";
      resumeScanner();
    }

    function resumeScanner() {
      isPaused = false;
      try { scanner.resume(); } catch(e){}
    }

    document.getElementById('barcode').addEventListener('focus', () => {
      document.querySelector('input[name="scanTarget"][value="barcode"]').checked = true;
    });
    document.getElementById('platz').addEventListener('focus', () => {
      document.querySelector('input[name="scanTarget"][value="platz"]').checked = true;
    });

    document.getElementById('barcode').addEventListener('change', (e) => {
      fetchArticleInfo(e.target.value.trim());
    });

    document.addEventListener("DOMContentLoaded", () => {
      loadStorageLocations();
      loadShoppingList();
    });

    // --- EINKAUFSLISTEN LOGIK MIT DURCHSTREICH-FUNKTION ---
    function toggleShoppingList() {
      let drawer = document.getElementById('shoppingListDrawer');
      if (drawer.style.display === "none" || drawer.style.display === "") {
        drawer.style.display = "block";
        loadShoppingList();
      } else {
        drawer.style.display = "none";
      }
    }

    function loadShoppingList() {
      let list = JSON.parse(localStorage.getItem("lagerEinkaufsliste") || "[]");
      let container = document.getElementById('shoppingListContainer');
      let badge = document.getElementById('shoppingCountBadge');
      
      // Berechnet verbleibende offene Buchungspositionen
      let openItemsCount = list.filter(item => !item.gebucht).length;
      badge.innerText = openItemsCount;
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<span style="font-size:12px; color:#64748b; text-align:center;">Keine Artikel in der Einkaufsliste.</span>`;
        return;
      }

      // Sortieren: Offene Elemente oben, bereits gebuchte ganz unten
      list.sort((a, b) => (a.gebucht === b.gebucht) ? 0 : a.gebucht ? 1 : -1);

      list.forEach((item) => {
        let card = document.createElement("div");
        card.className = "shopping-item-card" + (item.gebucht ? " completed" : "");

        if (!item.gebucht) {
          card.onclick = () => selectShoppingItem(item);
        }

        card.innerHTML = `
          <div class="shopping-item-info">
            <span class="shopping-item-name">${item.name || 'Unbekannt'}</span>
            <span class="shopping-item-code">Barcode: ${item.barcode}</span>
          </div>
          <span class="shopping-item-qty">${item.gebucht ? '✓ Gebucht' : '+' + (item.menge || 1) + ' Stk.'}</span>
        `;
        container.appendChild(card);
      });
    }

    function selectShoppingItem(item) {
      document.getElementById('barcode').value = item.barcode || "";
      document.getElementById('name').value = item.name || "";
      document.getElementById('menge').value = item.menge || 1;
      document.getElementById('typ').value = "EK";

      fetchArticleInfo(item.barcode);
      document.getElementById('platz').focus();
      
      document.getElementById('shoppingListDrawer').style.display = "none";
    }

    async function loadStorageLocations() {
      try {
        let res = await fetch(`${API_URL}?action=getAllArticles`);
        let resData = await res.json();
        let articles = Array.isArray(resData) ? resData : (resData.data || []);

        let locations = new Set();
        articles.forEach(item => {
          if (item.platz) locations.add(String(item.platz).trim());
          if (item.plaetze) {
            if (Array.isArray(item.plaetze)) {
              item.plaetze.forEach(p => locations.add(String(p.platz || p).trim()));
            } else if (typeof item.plaetze === 'object') {
              for (let p in item.plaetze) locations.add(String(p).trim());
            }
          }
        });

        let datalist = document.getElementById('platzList');
        datalist.innerHTML = "";
        Array.from(locations).sort().forEach(loc => {
          if (loc) {
            let opt = document.createElement("option");
            opt.value = loc;
            datalist.appendChild(opt);
          }
        });
      } catch (e) {
        console.log("Fehler beim Laden aller Lagerplätze:", e);
      }
    }

    async function fetchArticleInfo(code) {
      if (!code) return;

      let nameInput = document.getElementById('name');
      let status = document.getElementById('status');
      let infoBox = document.getElementById('productInfoBox');
      let infoContent = document.getElementById('infoContent');
      let btnUvp = document.getElementById('btnApplyUvp');
      let stockBox = document.getElementById('stockLocationBox');
      let stockList = document.getElementById('stockList');

      infoBox.style.display = "none";
      btnUvp.style.display = "none";
      stockBox.style.display = "none";
      stockList.innerHTML = "";
      infoContent.innerHTML = "";
      detectedUvp = null;

      try {
        let res = await fetch(`${API_URL}?action=getArticle&barcode=${encodeURIComponent(code)}`);
        let data = await res.json();
        
        if (data && (data.info || data.plaetze)) {
          let info = data.info || {};
          
          if (info.name && info.name !== "Unbekannt") {
            nameInput.value = info.name;
            updatePriceByTyp(info);
            status.innerText = "";
          }

          let plaetzeObj = data.plaetze || info.plaetze || {};
          let html = "";
          let foundPlaces = false;

          if (Array.isArray(plaetzeObj)) {
            plaetzeObj.forEach(p => {
              let pName = p.platz || p.name || p;
              let pMenge = p.menge !== undefined ? p.menge : "?";
              html += `<span class="place-tag" onclick="selectPlace('${pName}')">📍 ${pName} <span class="badge-qty">${pMenge} Stk.</span></span>`;
              foundPlaces = true;
            });
          } else if (typeof plaetzeObj === 'object') {
            for (let p in plaetzeObj) {
              html += `<span class="place-tag" onclick="selectPlace('${p}')">📍 ${p} <span class="badge-qty">${plaetzeObj[p]} Stk.</span></span>`;
              foundPlaces = true;
            }
          }

          if (foundPlaces) {
            stockList.innerHTML = html;
            stockBox.style.display = "block";
          }

          if (info.name && info.name !== "Unbekannt") return;
        }
      } catch (e) { 
        console.log("Fehler bei Backend-Abfrage:", e); 
      }

      status.innerText = "🔍 Durchsuche externe EAN-Datenbanken...";

      try {
        let extRes = await fetch(`https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(code)}.json`);
        let extData = await extRes.json();

        if (extData.status === 1 && extData.product) {
          let p = extData.product;
          let prodName = p.product_name_de || p.product_name || "";
          if (prodName) {
            nameInput.value = prodName;
            status.innerText = "🌐 Produktname gefunden (Open Food Facts)!";

            let details = [];
            if (p.brands) details.push(`<b>Marke:</b> ${p.brands}`);
            if (p.quantity) details.push(`<b>Menge:</b> ${p.quantity}`);

            if (details.length > 0) {
              infoContent.innerHTML = details.join(" | ");
              infoBox.style.display = "block";
            }
            return;
          }
        }
      } catch (e) {}

      status.innerText = "⚠️ Produkt in keiner externen Datenbank gefunden. Bitte Name und Preis manuell eingeben.";
    }

    function selectPlace(placeName) {
      document.getElementById('platz').value = placeName;
    }

    function applyUvpPrice() {
      if (detectedUvp) {
        document.getElementById('preis').value = detectedUvp;
        document.getElementById('typ').value = "VK";
      }
    }

    document.getElementById('typ').addEventListener('change', () => {
      let code = document.getElementById('barcode').value.trim();
      if (code) fetchArticleInfo(code);
    });

    function updatePriceByTyp(info) {
      let typ = document.getElementById('typ').value;
      if (typ === "EK" && info.ek_preis) document.getElementById('preis').value = info.ek_preis;
      if (typ === "VK" && info.vk_preis) document.getElementById('preis').value = info.vk_preis;
    }

    function confirmAndSubmit(e) {
      e.preventDefault();
      if (isProcessing) return;
      
      let barcode = document.getElementById('barcode').value.trim();
      let name = document.getElementById('name').value.trim() || "Unbekannt";
      let platz = document.getElementById('platz').value.trim();
      let typ = document.getElementById('typ').value;
      let menge = document.getElementById('menge').value;
      let preis = document.getElementById('preis').value;

      let msg = `Bitte finale Buchung überprüfen:\n\n` +
                `Typ: ${typ === "EK" ? "Wareneinkauf (EK)" : "Warenverkauf (VK)"}\n` +
                `Artikel: ${name} (${barcode})\n` +
                `Lagerplatz: ${platz}\n` +
                `Menge: ${menge} Stück\n` +
                `Einzelpreis: ${preis} €\n` +
                `Gesamtwert: ${(menge * preis).toFixed(2)} €\n\n` +
                `Jetzt verbindlich buchen?`;

      if (confirm(msg)) {
        submitBooking();
      }
    }

    async function submitBooking() {
      isProcessing = true;
      let btn = document.getElementById('submitBtn');
      let status = document.getElementById('status');
      document.getElementById('invoiceArea').style.display = "none";
      
      btn.disabled = true;
      status.innerText = "Sende Buchung...";

      let barcode = document.getElementById('barcode').value.trim();
      let name = document.getElementById('name').value.trim() || "Unbekannt";
      let platz = document.getElementById('platz').value.trim();
      let typ = document.getElementById('typ').value;
      let menge = document.getElementById('menge').value;
      let preis = document.getElementById('preis').value;

      let payload = { action: "postBooking", barcode, name, platz, typ, menge, preis };

      try {
        let res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        let result = await res.json();

        if (result.status === "success") {
          status.innerText = "✅ Gebucht! ID: " + result.data.id;
          
          if (typ === "VK") {
            lastBookingData = {
              id: result.data.id,
              date: new Date().toLocaleDateString('de-DE'),
              time: new Date().toLocaleTimeString('de-DE'),
              barcode: barcode,
              name: name,
              menge: Number(menge),
              preis: Number(preis),
              gesamt: (Number(menge) * Number(preis)).toFixed(2)
            };
            document.getElementById('invoiceArea').style.display = "block";
          }

          // NEU: Artikel als gebucht markieren (statt zu löschen)
          let list = JSON.parse(localStorage.getItem("lagerEinkaufsliste") || "[]");
          let targetItem = list.find(item => item.barcode === barcode && !item.gebucht);
          if (targetItem) {
            targetItem.gebucht = true;
            localStorage.setItem("lagerEinkaufsliste", JSON.stringify(list));
          }

          loadShoppingList();

          document.getElementById('bookingForm').reset();
          document.getElementById('productInfoBox').style.display = "none";
          document.getElementById('stockLocationBox').style.display = "none";
          document.querySelector('input[name="scanTarget"][value="barcode"]').checked = true;
          loadStorageLocations();
        } else {
          status.innerText = "❌ Fehler: " + result.message;
        }
      } catch (err) {
        status.innerText = "❌ Verbindungsfehler!";
      } finally {
        isProcessing = false;
        btn.disabled = false;
      }
    }

    function generateInvoicePDF() {
      if (!lastBookingData) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(20);
      doc.setFont("helvetica", "bold");
      doc.text("RECHNUNG / QUITTUNG", 14, 20);

      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text(`Beleg-Nr.: ${lastBookingData.id}`, 14, 30);
      doc.text(`Datum: ${lastBookingData.date} - ${lastBookingData.time}`, 14, 35);

      doc.autoTable({
        startY: 45,
        head: [['Pos.', 'Barcode', 'Artikelbeschreibung', 'Menge', 'Einzelpreis', 'Gesamt']],
        body: [
          [
            '1',
            lastBookingData.barcode,
            lastBookingData.name,
            `${lastBookingData.menge} Stk.`,
            `${lastBookingData.preis.toFixed(2)} €`,
            `${lastBookingData.gesamt} €`
          ]
        ],
        theme: 'striped',
        headStyles: { fillColor: [37, 99, 235] }
      });

      let finalY = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.text(`Gesamtbetrag: ${lastBookingData.gesamt} EUR`, 140, finalY);

      doc.setFontSize(9);
      doc.setFont("helvetica", "italic");
      doc.text("Vielen Dank für Ihren Einkauf!", 14, finalY + 15);

      doc.save(`Rechnung_${lastBookingData.id}.pdf`);
    }
  </script>
</body>
</html>
