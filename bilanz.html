<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Chart.js für Diagramme einbinden -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f8f9fa; color: #333; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .kpi-container { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
    .kpi { flex: 1; min-width: 150px; background: #eef2f5; padding: 15px; border-radius: 6px; text-align: center; }
    .kpi h4 { margin: 0 0 5px 0; color: #666; font-size: 14px; }
    .kpi .val { font-size: 20px; font-weight: bold; color: #2c3e50; }
    
    .chart-container { position: relative; max-width: 600px; margin: auto; height: 320px; }
    .btn-group { display: flex; justify-content: center; margin-bottom: 15px; gap: 10px; }
    .btn-group button { padding: 8px 16px; border: 1px solid #007bff; background: white; color: #007bff; border-radius: 4px; cursor: pointer; }
    .btn-group button.active { background: #007bff; color: white; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #2c3e50; color: white; }
    tr:nth-child(even) { background: #f2f2f2; }
    .status-msg { margin-top: 10px; font-weight: bold; color: #d35400; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📊 Finanzübersicht & Prozent-Analyse</h2>
    
    <!-- Filter -->
    <div style="display:flex; gap:10px; margin-bottom: 10px; flex-wrap: wrap;">
      <label>Von: <input type="date" id="filterVon"></label>
      <label>Bis: <input type="date" id="filterBis"></label>
      <label>Artikel/Barcode: <input type="text" id="filterArtikel" placeholder="Optional..."></label>
      <button onclick="loadFinanceData()" style="padding:5px 15px;">Daten laden</button>
    </div>
    <div id="statusText" class="status-msg"></div>

    <!-- KPI Dashboard -->
    <div class="kpi-container" style="margin-top:15px;">
      <div class="kpi"><h4>Lagerwert (EK)</h4><div class="val" id="valLagerwert">0,00 €</div></div>
      <div class="kpi"><h4>Umsatz (VK)</h4><div class="val" id="valUmsatz">0,00 €</div></div>
      <div class="kpi"><h4>Wareneinsatz (EK)</h4><div class="val" id="valEK">0,00 €</div></div>
      <div class="kpi"><h4>Rohgewinn</h4><div class="val" id="valRohgewinn">0,00 €</div></div>
    </div>
  </div>

  <!-- Diagramm Sektion -->
  <div class="card">
    <h3>Prozentuale Verteilung pro Artikel</h3>
    <div class="btn-group">
      <button id="btnTabLager" class="active" onclick="switchChartTab('lager')">Kapitalbindung / Lagerwert (%)</button>
      <button id="btnTabUmsatz" onclick="switchChartTab('umsatz')">Umsatzbeitrag (%)</button>
    </div>
    
    <div class="chart-container">
      <canvas id="financeChart"></canvas>
    </div>
  </div>

  <!-- Transaktionen Sektion -->
  <div class="card">
    <h3>Einzeltransaktionen im Zeitraum</h3>
    <table>
      <thead>
        <tr>
          <th>Datum</th>
          <th>Typ</th>
          <th>Artikel</th>
          <th>Menge</th>
          <th>Einzelpreis (€)</th>
          <th>Gesamt (€)</th>
        </tr>
      </thead>
      <tbody id="tblTransaktionen">
        <tr><td colspan="6" style="text-align:center;">Keine Daten geladen.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ⚠️ HIER IHRE DEPLOYTE WEB-APP-URL EINTRAGEN (falls die HTML lokal oder extern läuft)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwp9yMSa_6WerEL7CIUmDyKdH9G73DZVgbOFmjMQZrxf8IWSEPAbY-mrOlAZT6BoG7P/exec";

    var globalFinanceData = null;
    var chartInstance = null;
    var currentChartMode = 'lager';

    function setStatus(text) {
      document.getElementById('statusText').innerText = text;
    }

    function loadFinanceData() {
      setStatus("Lade Daten...");
      
      var von = document.getElementById('filterVon').value;
      var bis = document.getElementById('filterBis').value;
      var artikel = document.getElementById('filterArtikel').value;

      var payload = { action: "getFinance", von: von, bis: bis, artikel: artikel };

      // 1. Prüfen, ob die Datei in Google Apps Script läuft (google.script.run verfügbar)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onFinanceDataLoaded)
          .withFailureHandler(function(err) {
            setStatus("Fehler: " + err);
          })
          .handleRequest_(payload);
      } 
      // 2. Falls extern geöffnet, direkte HTTP/Fetch-Anfrage an die Web-App-URL nutzen
      else if (WEB_APP_URL && !WEB_APP_URL.includes("DEINE_EXEC_ID_HIER")) {
        var params = new URLSearchParams(payload).toString();
        fetch(WEB_APP_URL + "?" + params)
          .then(response => response.json())
          .then(data => onFinanceDataLoaded(data))
          .catch(err => setStatus("Netzwerkfehler: " + err));
      } 
      // 3. Wenn weder noch zutrifft
      else {
        setStatus("⚠️ Bitte tragen Sie oben im Script die 'WEB_APP_URL' Ihres Backends ein!");
      }
    }

    function onFinanceDataLoaded(response) {
      if (!response || response.status !== "success") {
        setStatus("Fehler beim Laden der Daten: " + (response ? response.message : "Keine Antwort"));
        return;
      }
      
      setStatus(""); // Status zurücksetzen
      var data = response.data;
      globalFinanceData = data;

      // KPIs rendern
      document.getElementById('valLagerwert').innerText = formatCurrency(data.lagerwert);
      document.getElementById('valUmsatz').innerText = formatCurrency(data.umsatzVK);
      document.getElementById('valEK').innerText = formatCurrency(data.wareneinsatzEK);
      document.getElementById('valRohgewinn').innerText = formatCurrency(data.rohgewinn);

      // Transaktionstabelle & Chart rendern
      renderTable(data.transaktionen);
      renderCurrentChart();
    }

    function renderTable(list) {
      var tbody = document.getElementById('tblTransaktionen');
      tbody.innerHTML = "";
      
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Keine Buchungen im Zeitraum gefunden.</td></tr>';
        return;
      }

      list.forEach(item => {
        var tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.datum}</td>
          <td><strong>${item.typ}</strong></td>
          <td>${item.artikel}</td>
          <td>${item.menge}</td>
          <td>${formatCurrency(item.einzelpreis)}</td>
          <td>${formatCurrency(item.gesamt)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function switchChartTab(mode) {
      currentChartMode = mode;
      document.getElementById('btnTabLager').classList.toggle('active', mode === 'lager');
      document.getElementById('btnTabUmsatz').classList.toggle('active', mode === 'umsatz');
      renderCurrentChart();
    }

    function renderCurrentChart() {
      if (!globalFinanceData) return;

      var items = currentChartMode === 'lager' 
        ? globalFinanceData.anteilLagerwert 
        : globalFinanceData.anteilUmsatz;

      var labels = items.map(i => i.artikel);
      var values = items.map(i => parseFloat(i.prozent));

      var ctx = document.getElementById('financeChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      if (items.length === 0) {
        return;
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            label: 'Anteil (%)',
            data: values,
            backgroundColor: [
              '#2ecc71', '#3498db', '#9b59b6', '#f1c40f', '#e67e22', '#e74c3c', '#34495e', '#1abc9c'
            ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            tooltip: {
              callbacks: {
                label: function(context) {
                  var rawVal = items[context.dataIndex].wert;
                  return `${context.label}: ${context.raw}% (${formatCurrency(rawVal)})`;
                }
              }
            }
          }
        }
      });
    }

    function formatCurrency(val) {
      return parseFloat(val || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
    }

    // Beim Laden der Seite automatisch Daten abrufen
    window.onload = loadFinanceData;
  </script>
</body>
</html>
