<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Artikel mit Bestand 0</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2 {
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 20px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #c0392b;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #e9ecef;
    }
    th {
      background-color: #34495e;
      color: white;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #fcfcfc;
    }
    tr:hover {
      background-color: #f1f3f5;
    }
    .badge-zero {
      color: #d9534f;
      font-weight: bold;
      background-color: #fdf7f7;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #f5c6cb;
      display: inline-block;
    }
    .status-msg {
      font-size: 15px;
      padding: 12px;
      border-radius: 5px;
      background-color: #e9ecef;
      color: #495057;
    }
    .status-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .status-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>⚠️ Artikel ohne Bestand (0 auf Lager)</h2>
    <button class="btn" onclick="loadZeroStockArticles()">🔄 Daten aktualisieren</button>

    <div id="status" class="status-msg">Lade Daten...</div>

    <table id="zeroStockTable" style="display: none;">
      <thead>
        <tr>
          <th>Barcode</th>
          <th>Warenname</th>
          <th>EK-Preis (€)</th>
          <th>VK-Preis (€)</th>
          <th>Bestand</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    // Web-App URL für den API-Aufruf
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwp9yMSa_6WerEL7CIUmDyKdH9G73DZVgbOFmjMQZrxf8IWSEPAbY-mrOlAZT6BoG7P/exec";

    // Automatisches Laden beim Öffnen der Seite
    document.addEventListener("DOMContentLoaded", loadZeroStockArticles);

    function loadZeroStockArticles() {
      const statusDiv = document.getElementById("status");
      const table = document.getElementById("zeroStockTable");
      const tbody = document.getElementById("tableBody");

      statusDiv.style.display = "block";
      statusDiv.className = "status-msg";
      statusDiv.innerText = "Lade Artikel mit Bestand 0...";
      table.style.display = "none";
      tbody.innerHTML = "";

      // 1. Wenn die Seite intern im Google Apps Script Kontext ausgeführt wird:
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(renderArticles)
          .withFailureHandler(showError)
          .getZeroStockArticles();
      } 
      // 2. Wenn die Seite extern aufgerufen wird (Anfrage an die Web-App URL):
      else {
        fetch(`${WEB_APP_URL}?action=getZeroStock`)
          .then(response => {
            if (!response.ok) {
              throw new Error("Netzwerk-Antwort war nicht OK (" + response.status + ")");
            }
            return response.json();
          })
          .then(res => {
            if (res.status === "success") {
              renderArticles(res.data);
            } else {
              showError(new Error(res.message || "Fehler beim Abrufen der Daten"));
            }
          })
          .catch(err => showError(err));
      }
    }

    function renderArticles(articles) {
      const statusDiv = document.getElementById("status");
      const table = document.getElementById("zeroStockTable");
      const tbody = document.getElementById("tableBody");

      if (!articles || articles.length === 0) {
        statusDiv.className = "status-msg status-success";
        statusDiv.innerText = "🎉 Keines der Produkte ist aktuell auf Bestand 0!";
        return;
      }

      statusDiv.style.display = "none";

      articles.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${escapeHtml(item.barcode)}</td>
          <td><strong>${escapeHtml(item.name)}</strong></td>
          <td>${Number(item.ek || 0).toFixed(2)} €</td>
          <td>${Number(item.vk || 0).toFixed(2)} €</td>
          <td><span class="badge-zero">${item.bestand}</span></td>
        `;
        tbody.appendChild(row);
      });

      table.style.display = "table";
    }

    function showError(err) {
      const statusDiv = document.getElementById("status");
      statusDiv.className = "status-msg status-error";
      statusDiv.innerText = "Fehler beim Laden: " + (err.message || err);
    }

    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
