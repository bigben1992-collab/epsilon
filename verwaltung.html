<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lager Beta - Verwaltung</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; margin: 15px; background: #f4f6f8; }
    nav { background: #fff; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    nav a { text-decoration: none; color: #2563eb; font-weight: bold; }
    .card { background: #fff; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .btn-warn { background: #d97706; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
    label { font-size: 13px; font-weight: bold; color: #475569; display: block; margin-top: 5px; }
    .reader-box { width: 100%; max-width: 300px; margin: 0 auto 10px auto; }
    
    /* Target-Auswahlfelder */
    .scan-target-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .scan-target-box label { font-weight: bold; cursor: pointer; color: #1e40af; margin-top: 0; }

    /* Info-Box für aktuelle Bestände & Plätze */
    .stock-info {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 0;
      font-size: 13px;
    }
    .stock-info ul { margin: 4px 0 0 0; padding-left: 20px; }
    .stock-info li { font-weight: bold; color: #0f172a; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Buchen (EK/VK)</a> |
    <a href="artikel.html">Artikel & Druck</a> |
    <a href="platz.html">Platzabfrage</a> |
    <a href="bilanz.html">Bilanz</a> |
    <a href="verwaltung.html">Verwaltung</a>
  </nav>

  <div class="grid">
    <!-- Stammdaten & Preise anpassen (Passiv) -->
    <div class="card">
      <h3>Preise anpassen (Passiv)</h3>
      <div id="readerPrice" class="reader-box"></div>
      <input type="text" id="pBarcode" placeholder="Barcode scannen / eingeben">
      <button onclick="loadArticlePrices()">Artikel Laden</button>
      
      <div id="priceForm" style="display:none; margin-top:10px;">
        <label>EK-Preis (€):</label>
        <input type="number" step="0.01" id="pEk">
        <label>VK-Preis (€):</label>
        <input type="number" step="0.01" id="pVk">
        <button class="btn-warn" onclick="savePrices()">Preise Aktualisieren</button>
      </div>
      <p id="pStatus"></p>
    </div>

    <!-- Interne Umlagerung -->
    <div class="card">
      <h3>Umlagerung (Intern)</h3>
      
      <div class="scan-target-box">
        <span>Ziel für Scan:</span>
        <label><input type="radio" name="scanTargetRelocate" value="barcode" checked> 📦 Barcode</label>
        <label><input type="radio" name="scanTargetRelocate" value="von"> 📍 Von Platz</label>
        <label><input type="radio" name="scanTargetRelocate" value="nach"> 📍 Nach Platz</label>
      </div>

      <div id="readerRelocate" class="reader-box"></div>
      <input type="text" id="uBarcode" placeholder="Barcode scannen / eingeben">
      
      <!-- Anzeige für aktuelle Lagerplätze -->
      <div id="uStockInfo" class="stock-info" style="display:none;"></div>

      <input type="text" id="uVon" placeholder="Von Platz (z.B. A1)">
      <input type="text" id="uNach" placeholder="Nach Platz (z.B. B2)">
      <input type="number" id="uMenge" placeholder="Menge" value="1" min="1">
      <button onclick="executeRelocation()">Umlagern</button>
      <p id="uStatus"></p>
    </div>

    <!-- Bestandsanpassung / Inventur -->
    <div class="card">
      <h3>Bestand anpassen (Inventur/Korrektur)</h3>

      <div class="scan-target-box">
        <span>Ziel für Scan:</span>
        <label><input type="radio" name="scanTargetAdjust" value="barcode" checked> 📦 Barcode</label>
        <label><input type="radio" name="scanTargetAdjust" value="platz"> 📍 Lagerplatz</label>
      </div>

      <div id="readerAdjust" class="reader-box"></div>
      <input type="text" id="aBarcode" placeholder="Barcode scannen / eingeben">
      
      <!-- Anzeige für aktuelle Lagerplätze -->
      <div id="aStockInfo" class="stock-info" style="display:none;"></div>

      <input type="text" id="aPlatz" placeholder="Lagerplatz (z.B. A1)">
      <input type="number" id="aMenge" placeholder="Neuer Ist-Bestand (Soll)" min="0">
      <button class="btn-warn" onclick="executeAdjustment()">Bestand Überschreiben</button>
      <p id="aStatus"></p>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwp9yMSa_6WerEL7CIUmDyKdH9G73DZVgbOFmjMQZrxf8IWSEPAbY-mrOlAZT6BoG7P/exec";

    // Scanner 1: Preise
    const scannerPrice = new Html5QrcodeScanner("readerPrice", { fps: 10, qrbox: 180 });
    scannerPrice.render((text) => {
      let isCorrect = confirm(`Gescannter Code: ${text}\nAls Artikel-Barcode eintragen?`);
      if (isCorrect) {
        document.getElementById('pBarcode').value = text;
        loadArticlePrices();
      }
    });

    // Scanner 2: Umlagerung
    const scannerRelocate = new Html5QrcodeScanner("readerRelocate", { fps: 10, qrbox: 180 });
    scannerRelocate.render((text) => {
      let scanTarget = document.querySelector('input[name="scanTargetRelocate"]:checked').value;
      let targetLabel = scanTarget === 'barcode' ? 'Artikel-Barcode' : (scanTarget === 'von' ? 'Von-Lagerplatz' : 'Nach-Lagerplatz');

      let isCorrect = confirm(`Gescannter Code: ${text}\nAls ${targetLabel} eintragen?`);
      if (isCorrect) {
        if (scanTarget === 'barcode') {
          document.getElementById('uBarcode').value = text;
          fetchCurrentStock(text, 'uStockInfo');
          document.querySelector('input[name="scanTargetRelocate"][value="von"]').checked = true;
        } else if (scanTarget === 'von') {
          document.getElementById('uVon').value = text;
          document.querySelector('input[name="scanTargetRelocate"][value="nach"]').checked = true;
        } else {
          document.getElementById('uNach').value = text;
          document.querySelector('input[name="scanTargetRelocate"][value="barcode"]').checked = true;
        }
      }
    });

    // Scanner 3: Bestandsanpassung
    const scannerAdjust = new Html5QrcodeScanner("readerAdjust", { fps: 10, qrbox: 180 });
    scannerAdjust.render((text) => {
      let scanTarget = document.querySelector('input[name="scanTargetAdjust"]:checked').value;
      let targetLabel = scanTarget === 'barcode' ? 'Artikel-Barcode' : 'Lagerplatz';

      let isCorrect = confirm(`Gescannter Code: ${text}\nAls ${targetLabel} eintragen?`);
      if (isCorrect) {
        if (scanTarget === 'barcode') {
          document.getElementById('aBarcode').value = text;
          fetchCurrentStock(text, 'aStockInfo');
          document.querySelector('input[name="scanTargetAdjust"][value="platz"]').checked = true;
        } else {
          document.getElementById('aPlatz').value = text;
          document.querySelector('input[name="scanTargetAdjust"][value="barcode"]').checked = true;
        }
      }
    });

    // Event Listener für manuelle Eingaben / USB-Scanner
    document.getElementById('uBarcode').addEventListener('change', (e) => {
      fetchCurrentStock(e.target.value.trim(), 'uStockInfo');
    });
    document.getElementById('aBarcode').addEventListener('change', (e) => {
      fetchCurrentStock(e.target.value.trim(), 'aStockInfo');
    });

    // Focus Listener für Radio-Buttons
    document.getElementById('uBarcode').addEventListener('focus', () => {
      document.querySelector('input[name="scanTargetRelocate"][value="barcode"]').checked = true;
    });
    document.getElementById('uVon').addEventListener('focus', () => {
      document.querySelector('input[name="scanTargetRelocate"][value="von"]').checked = true;
    });
    document.getElementById('uNach').addEventListener('focus', () => {
      document.querySelector('input[name="scanTargetRelocate"][value="nach"]').checked = true;
    });

    document.getElementById('aBarcode').addEventListener('focus', () => {
      document.querySelector('input[name="scanTargetAdjust"][value="barcode"]').checked = true;
    });
    document.getElementById('aPlatz').addEventListener('focus', () => {
      document.querySelector('input[name="scanTargetAdjust"][value="platz"]').checked = true;
    });

    // Abfragefunktion für aktuelle Bestände – identisch zur Logik aus artikel.html
    async function fetchCurrentStock(barcode, containerId) {
      let infoBox = document.getElementById(containerId);
      if (!barcode) {
        infoBox.style.display = "none";
        return;
      }

      infoBox.style.display = "block";
      infoBox.innerHTML = "⏳ Suche Lagerorte...";

      try {
        let res = await fetch(`${API_URL}?action=getArticle&barcode=${encodeURIComponent(barcode)}`, { redirect: "follow" });
        let data = await res.json();

        // Validierung genau wie in artikel.html
        if (!data.info || (data.info.name === "Unbekannt" && Object.keys(data.plaetze || {}).length === 0)) {
          infoBox.innerHTML = "❌ Kein Artikel gefunden.";
          return;
        }

        let hasPlaces = data.plaetze && Object.keys(data.plaetze).length > 0;
        let html = `<strong>📍 ${data.info.name}</strong> (Gesamt: ${data.info.gesamtbestand || 0} Stk.)`;
        
        if (hasPlaces) {
          html += `<ul>`;
          for (let p in data.plaetze) {
            html += `<li>Lagerplatz <b>${p}</b>: ${data.plaetze[p]} Stück</li>`;
          }
          html += `</ul>`;
        } else {
          html += `<br><small>Derzeit an keinem Lagerplatz hinterlegt.</small>`;
        }

        infoBox.innerHTML = html;
      } catch (e) {
        infoBox.innerHTML = "❌ Fehler beim Abrufen der Standortdaten.";
      }
    }

    async function loadArticlePrices() {
      let code = document.getElementById('pBarcode').value.trim();
      let status = document.getElementById('pStatus');
      if (!code) return;
      
      status.innerText = "Lade Artikel...";
      try {
        let res = await fetch(`${API_URL}?action=getArticle&barcode=${encodeURIComponent(code)}`, { redirect: "follow" });
        let data = await res.json();
        
        if (data.info && data.info.name !== "Unbekannt") {
          document.getElementById('pEk').value = data.info.ek_preis;
          document.getElementById('pVk').value = data.info.vk_preis;
          document.getElementById('priceForm').style.display = "block";
          status.innerText = "Artikel: " + data.info.name;
        } else {
          status.innerText = "❌ Artikel nicht gefunden.";
          document.getElementById('priceForm').style.display = "none";
        }
      } catch (err) {
        status.innerText = "❌ Fehler beim Laden!";
      }
    }

    async function savePrices() {
      let code = document.getElementById('pBarcode').value.trim();
      let ek = document.getElementById('pEk').value;
      let vk = document.getElementById('pVk').value;
      let status = document.getElementById('pStatus');

      status.innerText = "Speichere Preise...";
      try {
        let res = await fetch(`${API_URL}?action=updatePrices&barcode=${encodeURIComponent(code)}&ek_preis=${ek}&vk_preis=${vk}`, { redirect: "follow" });
        let data = await res.json();
        if (data.status === "success") {
          status.innerText = "✅ Preise erfolgreich aktualisiert!";
        } else {
          status.innerText = "❌ Fehler: " + data.message;
        }
      } catch (err) {
        status.innerText = "❌ Fehler beim Speichern!";
      }
    }

    async function executeRelocation() {
      let code = document.getElementById('uBarcode').value.trim();
      let von = document.getElementById('uVon').value.trim();
      let nach = document.getElementById('uNach').value.trim();
      let menge = document.getElementById('uMenge').value;
      let status = document.getElementById('uStatus');

      if (!code || !von || !nach || !menge) {
        status.innerText = "Bitte alle Felder ausfüllen.";
        return;
      }

      status.innerText = "Buche Um...";
      try {
        let res = await fetch(`${API_URL}?action=relocateStock&barcode=${encodeURIComponent(code)}&vonPlatz=${encodeURIComponent(von)}&nachPlatz=${encodeURIComponent(nach)}&menge=${menge}`, { redirect: "follow" });
        let data = await res.json();
        if (data.status === "success") {
          status.innerText = "✅ Erfolgreich umgelagert!";
          document.getElementById('uBarcode').value = "";
          document.getElementById('uVon').value = "";
          document.getElementById('uNach').value = "";
          document.getElementById('uMenge').value = "1";
          document.getElementById('uStockInfo').style.display = "none";
          document.querySelector('input[name="scanTargetRelocate"][value="barcode"]').checked = true;
        } else {
          status.innerText = "❌ Fehler: " + data.message;
        }
      } catch (err) {
        status.innerText = "❌ Fehler bei der Umbuchung!";
      }
    }

    async function executeAdjustment() {
      let code = document.getElementById('aBarcode').value.trim();
      let platz = document.getElementById('aPlatz').value.trim();
      let menge = document.getElementById('aMenge').value;
      let status = document.getElementById('aStatus');

      if (!code || !platz || menge === "") {
        status.innerText = "Bitte Barcode, Platz und die neue Menge angeben.";
        return;
      }

      status.innerText = "Korrigiere Bestand...";
      try {
        let res = await fetch(`${API_URL}?action=adjustStock&barcode=${encodeURIComponent(code)}&platz=${encodeURIComponent(platz)}&neueMenge=${menge}`, { redirect: "follow" });
        let data = await res.json();
        
        if (data.status === "success") {
          status.innerText = `✅ Bestand aktualisiert! (Vorher: ${data.data.alteMenge} -> Neu: ${data.data.neueMenge})`;
          document.getElementById('aBarcode').value = "";
          document.getElementById('aPlatz').value = "";
          document.getElementById('aMenge').value = "";
          document.getElementById('aStockInfo').style.display = "none";
          document.querySelector('input[name="scanTargetAdjust"][value="barcode"]').checked = true;
        } else {
          status.innerText = "❌ Fehler: " + data.message;
        }
      } catch (err) {
        status.innerText = "❌ Fehler bei der Anpassung!";
      }
    }
  </script>
</body>
</html>
